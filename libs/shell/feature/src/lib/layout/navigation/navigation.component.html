<div class="navigation-content">
  <mat-nav-list>
    @for (remote of remotes; track remote.key) {
      <a
        mat-list-item
        [routerLink]="'/' + remote.path"
        routerLinkActive="active"
      >
        <mat-icon matListItemIcon>{{ remote.icon }}</mat-icon>
        <span matListItemTitle>{{ remote.title }}</span>
      </a>
    }
  </mat-nav-list>

  <mat-nav-list class="navigation-footer">
    <button mat-list-item type="button" (click)="logout()">
      <mat-icon matListItemIcon>logout</mat-icon>
      <span matListItemTitle>Sair</span>
    </button>
  </mat-nav-list>
</div>
