<div class="navigation-content">
  <mat-nav-list>
    @for (remote of remotes; track remote.key) {
      <a
        mat-list-item
        [routerLink]="'/' + remote.path"
        routerLinkActive="active"
      >
        @switch (remote.icon) {
          @case ('dashboard') {
            <ph-squares-four
              matListItemIcon
              class="pulso-icon pulso-icon--list"
              size="22"
              aria-hidden="true"
            />
          }
          @case ('folder') {
            <ph-folder
              matListItemIcon
              class="pulso-icon pulso-icon--list"
              size="22"
              aria-hidden="true"
            />
          }
        }
        <span matListItemTitle>{{ remote.title }}</span>
      </a>
    }
  </mat-nav-list>

  <mat-nav-list class="navigation-footer">
    <button mat-list-item type="button" (click)="logout()">
      <ph-sign-out
        matListItemIcon
        class="pulso-icon pulso-icon--list"
        size="22"
        aria-hidden="true"
      />
      <span matListItemTitle>Sair</span>
    </button>
  </mat-nav-list>
</div>
