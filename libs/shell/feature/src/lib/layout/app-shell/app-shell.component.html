<pulso-shell-loading-overlay [visible]="isLoading()" />

@if (authService.isAuthenticated()) {
  <mat-sidenav-container>
    <mat-sidenav
      #navigation
      [mode]="navigationMode()"
      [opened]="navigationOpened()"
      (openedChange)="syncNavigationState($event)"
    >
      <pulso-shell-navigation />
    </mat-sidenav>

    <mat-sidenav-content>
      <pulso-shell-topbar (menuToggle)="toggleNavigation()" />

      <main>
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <router-outlet />
}
