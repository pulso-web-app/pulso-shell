<main class="login-page">
  <pulso-shell-floating-particles [count]="48" [speed]="0.55" />

  <mat-card class="login-card">
    <div class="brand-mark" aria-hidden="true">
      <ph-squares-four class="pulso-icon" size="24" weight="duotone" />
    </div>

    <mat-card-header>
      <mat-card-title>Pulso</mat-card-title>

      <mat-card-subtitle> Acesse seu espaço de trabalho </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form class="login-form" [formGroup]="form" (ngSubmit)="login()">
        <mat-form-field appearance="outline">
          <ph-envelope-simple
            matPrefix
            class="pulso-icon pulso-icon--field-prefix"
            size="20"
            aria-hidden="true"
          />
          <mat-label>E-mail</mat-label>

          <input
            matInput
            type="email"
            formControlName="email"
            autocomplete="email"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <ph-lock-simple
            matPrefix
            class="pulso-icon pulso-icon--field-prefix"
            size="20"
            aria-hidden="true"
          />
          <mat-label>Senha</mat-label>

          <input
            matInput
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />

          <button
            mat-icon-button
            matSuffix
            class="pulso-icon-button"
            type="button"
            [attr.aria-label]="
              passwordVisible() ? 'Ocultar senha' : 'Mostrar senha'
            "
            (click)="togglePasswordVisibility()"
          >
            @if (passwordVisible()) {
              <ph-eye-slash
                class="pulso-icon pulso-icon--icon-button"
                size="22"
                aria-hidden="true"
              />
            } @else {
              <ph-eye
                class="pulso-icon pulso-icon--icon-button"
                size="22"
                aria-hidden="true"
              />
            }
          </button>
        </mat-form-field>

        @if (error()) {
          <p class="error">
            {{ error() }}
          </p>
        }

        <button
          class="submit-button"
          mat-flat-button
          type="submit"
          [disabled]="form.invalid || submitting()"
        >
          {{ submitting() ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>

  <p class="login-footer">Ewerton Mendes © 2026</p>
</main>
