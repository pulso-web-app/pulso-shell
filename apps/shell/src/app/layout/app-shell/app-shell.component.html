@if (authService.isAuthenticated()) {
  <mat-sidenav-container>
    <mat-sidenav #navigation mode="side" opened>
      <pulso-shell-navigation />
    </mat-sidenav>

    <mat-sidenav-content>
      <pulso-shell-topbar (menuToggle)="navigation.toggle()" />

      <main>
        <router-outlet />
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
} @else {
  <router-outlet />
}
