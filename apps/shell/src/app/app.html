@if (authService.isAuthenticated()) {
  <header>
    <strong>Pulso</strong>

    <nav>
      <a mat-button routerLink="/crm">
        CRM
      </a>

      <a mat-button routerLink="/projects">
        Projects
      </a>
    </nav>

    <span>
      {{ authService.user()?.email }}
    </span>

    <button
      mat-button
      type="button"
      (click)="logout()"
    >
      Sair
    </button>
  </header>
}

<main>
  <router-outlet />
</main>
