<main class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Pulso</mat-card-title>

      <mat-card-subtitle>
        Entre para continuar
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form
        class="login-form"
        [formGroup]="form"
        (ngSubmit)="login()"
      >
        <mat-form-field appearance="outline">
          <mat-label>E-mail</mat-label>

          <input
            matInput
            type="email"
            formControlName="email"
            autocomplete="email"
          />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Senha</mat-label>

          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>

        @if (error()) {
          <p class="error">
            {{ error() }}
          </p>
        }

        <button
          mat-flat-button
          type="submit"
          [disabled]="form.invalid || submitting()"
        >
          {{ submitting() ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
