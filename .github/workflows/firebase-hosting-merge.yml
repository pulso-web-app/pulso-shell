name: Deploy Shell to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run docs:check

      - name: Validate specifications
        run: npm run spec:validate

      - name: Lint
        run: npx nx run shell:lint

      - name: Test
        run: npx nx run shell:test

      - name: Build
        run: npx nx run shell:build:production

      - name: Deploy Shell
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PULSO_WEB_APP }}
          projectId: pulso-web-app
          target: shell
          channelId: live
